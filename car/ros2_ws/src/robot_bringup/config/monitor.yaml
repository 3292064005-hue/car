robot_monitor:
  ros__parameters:
    summary_period: 1.0
    event_log_path: /tmp/inspection_robot/events.jsonl
    event_log_flush_every: 8
    event_log_rotate_max_bytes: 524288
    event_log_backup_count: 4
    event_log_max_pending_records: 256
    metrics_path: /tmp/inspection_robot/metrics.json
    evidence_index_path: /tmp/inspection_robot/evidence_index.json
    evidence_index_auto_flush_every: 8
    diagnostics_enabled: true
    lifecycle_manager_status_topic: /robot/lifecycle_manager/status
    voice_ingress_health_topic: /robot/voice/ingress_health
