robot_vision:
  ros__parameters:
    stream_url: ''
    poll_period: 0.1
    snapshot_dir: /tmp/inspection_robot_snapshots
    snapshot_on_qrcode: true
    snapshot_on_color: true
    min_detection_confidence: 0.55
    color_profile_path: ''
    stable_detection_hits: 2
    stable_detection_misses: 3
    tracker_max_center_jump: 0.35
    tracker_max_area_ratio_delta: 1.5
    enable_debug_overlay: false
    qrcode_cooldown_sec: 2.0
    # Color target events/snapshots are edge-triggered. These cooldowns only suppress
    # rapid lost->reacquired chatter for the same label; continuous stable detection does
    # not re-emit target_detected or take new snapshots.
    color_detection_cooldown_sec: 1.0
    color_snapshot_min_interval_sec: 2.0
    capture_process_enabled: true
    capture_ipc_queue_max: 1
    capture_reconnect_backoff_sec: 0.5
    capture_reopen_after_misses: 5
